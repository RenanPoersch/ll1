name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Ler configuração do Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar dependências
        run: npm ci
      - name: Compilar Angular
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH}/"
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/analisador/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
